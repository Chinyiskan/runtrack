<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor">
        <h1>🏃 RunTrack</h1>
        <p class="subtitulo">Bitácora simple de carreras — Misión 32</p>

        <form id="formCarrera">
            <label for="inputFecha">Fecha</label>
            <input type="date" id="inputFecha" required>

            <label for="inputDistancia">Distancia (km)</label>
            <input type="number" id="inputDistancia" step="0.1" placeholder="Ej: 5.2" required>

            <label for="inputDuracion">Duración (minutos)</label>
            <input type="number" id="inputDuracion" placeholder="Ej: 32" required>

            <button type="submit">Registrar carrera</button>
        </form>

        <p id="mensajeEstado"></p>

        <h2>Mis carreras</h2>
        <div id="listaCarreras">
            <p class="vacio">Cargando carreras...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
